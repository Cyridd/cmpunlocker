[package]
name = "cmp40-efi"
description = "Read-only carrier and experimental CMP40HX CPU-RM EFI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.91"
publish = false

[features]
cpu-rm = ["dep:uefi-raw"]

[dependencies]
cmp40-efi-core = { path = "../core" }
uefi.workspace = true
uefi-raw = { version = "=0.17.0", optional = true }

[[bin]]
name = "cmp40-readonly"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "cmp40-cpu-rm-full"
path = "src/full.rs"
required-features = ["cpu-rm"]
test = false
bench = false

[[bin]]
name = "cmp40-cpu-rm-zero"
path = "src/zero.rs"
required-features = ["cpu-rm"]
test = false
bench = false

[[bin]]
name = "cmp40-logcheck"
path = "src/logcheck.rs"
required-features = ["cpu-rm"]
test = false
bench = false

[[bin]]
name = "cmp40-entrycheck"
path = "src/entrycheck.rs"
required-features = ["cpu-rm"]
test = false
bench = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
