# Build and publish a release when a version tag is pushed.
#
# Replaces the manual windows/tools/build_release.bat step for published
# releases: the binaries in the release ZIP are always built by CI
# from the tagged commit, with the same flags as the ci.yml smoke build, and
# accompanied by per-file checksums inside the ZIP and an archive checksum
# in the attached SHA256SUMS.txt.
#
# The release is created as a draft so the notes can be reviewed (and the
# assets verified) before it becomes public.
#
# Tag format: vX.Y.Z

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/tools/inst40hx/go.mod
          cache-dependency-path: windows/tools/*/go.sum

      - name: Build the executables
        shell: bash
        env:
          OUT: ${{ github.workspace }}/windows/release
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          flags=(-trimpath -ldflags='-H=windowsgui -s -w')
          # -C changes the module directory, so -o needs an absolute path.
          build() { # <module> <output>
            go build -C "windows/tools/$1" "${flags[@]}" -o "$OUT/$2" .
          }
          build inst40hx     40HXInstaller.exe
          build uninstall40x 40HXUninstaller.exe
          build check40x     40HXCheck.exe

      - name: Collect the packaged files
        shell: bash
        env:
          OUT: ${{ github.workspace }}/windows/release
        run: |
          set -euo pipefail
          mkdir -p "$OUT/gen2/drivers" "$OUT/files"
          cp windows/tools/inst40hx/embed/40HXUNLK.EFI "$OUT/files/40HXUNLK.EFI"
          cp windows/tools/inst40hx/embed/ThrottleStop.sys "$OUT/gen2/drivers/ThrottleStop.sys"
          cp windows/tools/inst40hx/embed/WinRing0x64.sys "$OUT/gen2/drivers/WinRing0x64.sys"
          cp windows/tools/inst40hx/embed/WinRing0x64.sys "$OUT/files/WinRing0x64.sys"
          cp windows/FORK_CHANGES.md "$OUT/FORK_CHANGES.md"
          cp windows/release-files/README.md "$OUT/README.md"
          cp windows/release-files/EFI应急修复指南.md "$OUT/"
          cp windows/release-files/AI辅助安装提示词.txt "$OUT/"
          cp windows/release-files/make_usb_efi.bat "$OUT/"
          cp windows/release-files/copy_efi_verified.ps1 "$OUT/"
          cp windows/tools/verify_source.ps1 "$OUT/"

      - name: Write SHA256SUMS.txt
        shell: bash
        env:
          OUT: ${{ github.workspace }}/windows/release
        run: |
          set -euo pipefail
          cd "$OUT"
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the Windows ZIP and archive checksum
        shell: python
        env:
          OUT: ${{ github.workspace }}/windows/release
          ASSETS: ${{ github.workspace }}/windows/release-assets
        run: |
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          out = Path(os.environ["OUT"])
          assets = Path(os.environ["ASSETS"])
          assets.mkdir(parents=True, exist_ok=True)
          archive = assets / f"CMP40HX-Windows-{os.environ['GITHUB_REF_NAME']}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(out.rglob("*")):
                  if path.is_file():
                      z.write(path, path.relative_to(out).as_posix())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (assets / "SHA256SUMS.txt").write_text(
              f"{digest}  {archive.name}\n", encoding="ascii"
          )
          print(f"Created {archive.name}: SHA-256 {digest}")

      - name: Publish a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ github.workspace }}/windows/release-assets
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Windows build of ${GITHUB_REF_NAME}.

          Download CMP40HX-Windows-${GITHUB_REF_NAME}.zip and verify it against the attached SHA256SUMS.txt. Extract the entire ZIP before running the installer; its SHA256SUMS.txt verifies the individual package files. See FORK_CHANGES.md inside the ZIP for the changes in this fork.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$ASSETS/CMP40HX-Windows-${GITHUB_REF_NAME}.zip" \
            "$ASSETS/SHA256SUMS.txt"
