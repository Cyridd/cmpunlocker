# CI for the CMP 40HX unlock project.
#
# Independent Windows/UEFI and Linux pre-driver gates:
#
#   1. go-tools — builds every Go module, vets it, and runs the unit tests
#      that can only execute on Windows (40hxcore imports
#      golang.org/x/sys/windows, so the test binary is Windows-only). The
#      matrix runs the native Windows build and the Linux cross-build that
#      the README documents, so both supported paths stay working. A Linux
#      cross-build is also the cheapest proof that the tree is complete:
#      inst40hx fails to compile if any //go:embed input went missing.
#
#   2. rust-efi-core — checks the Rust EFI against its C reference,
#      compares the installer image with a fresh FULL build, and runs QEMU.
#
# The Linux pre-driver job builds without loading a module and exercises the firmware
# parsers/layout offline. The open-module patch series has its separate CI.

name: CI

on:
  push:
    branches: [main, port/rust]
    paths:
      - 'windows/**'
      - 'linux/preboot/**'
      - 'tools/gen2/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'linux/preboot/**'
      - 'tools/gen2/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-efi-core:
    name: Rust EFI core, carrier and QEMU boot checks
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: '1.100.0'
    defaults:
      run:
        working-directory: windows/efi-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-gnu --target x86_64-unknown-uefi
      - name: Fetch locked EFI dependencies
        run: cargo +"$RUST_TOOLCHAIN" fetch --locked --target x86_64-unknown-uefi
      - name: Check formatting and lints
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
          cargo +"$RUST_TOOLCHAIN" clippy --locked --offline -p cmp40-efi-core --all-targets -- -D warnings
          cargo +"$RUST_TOOLCHAIN" clippy --locked --offline --target x86_64-unknown-uefi -p cmp40-efi -p cmp40-efi-boot-fixture -- -D warnings
          cargo +"$RUST_TOOLCHAIN" clippy --locked --offline --target x86_64-unknown-uefi -p cmp40-efi --features unlock -- -D warnings
          cargo +"$RUST_TOOLCHAIN" clippy --locked --offline --target x86_64-unknown-uefi -p cmp40-efi-boot-fixture --features adapters -- -D warnings
          cargo +"$RUST_TOOLCHAIN" clippy --locked --offline --target x86_64-unknown-uefi -p cmp40-efi -p cmp40-efi-boot-fixture --features gen2-experiment,adapters -- -D warnings
      - name: Compare Rust boot data and firmware operations with the actual C EFI functions
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" test --locked --offline -p cmp40-efi-core
          python3 tests/test_assets.py
          python3 -m unittest discover -s tests -p 'test_trace_log.py' -v
      - name: Check the core for the Windows target
        run: cargo +"$RUST_TOOLCHAIN" check --locked --offline -p cmp40-efi-core --lib --target x86_64-pc-windows-gnu
      - name: Build the standard EFI and test boot targets
        run: cargo +"$RUST_TOOLCHAIN" build --locked --offline --release --target x86_64-unknown-uefi -p cmp40-efi -p cmp40-efi-boot-fixture --features unlock,adapters
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Compare the embedded EFI with the Rust FULL build
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          set -euo pipefail
          bash build_installer_efi.sh
          python3 tests/compare_installer_efi.py target/x86_64-unknown-uefi/release/cmp40-unlock-full.efi ../tools/inst40hx/embed/40HXUNLK.EFI
      - name: Boot the installer EFI and verify persisted logs and parked failure in QEMU
        run: python3 tests/qemu_smoke.py --unlock --adapters --raw --rebar
      - name: Check early logs and unstarted candidate images
        run: python3 tests/qemu_smoke.py --case entrycheck --case entrycheck-invalid
      - name: Build the Gen2 experiment and test fixtures
        run: cargo +"$RUST_TOOLCHAIN" build --locked --offline --release --target x86_64-unknown-uefi --target-dir target/gen2 -p cmp40-efi -p cmp40-efi-boot-fixture --features gen2-experiment,adapters
      - name: Boot the Gen2 experiment in QEMU
        run: python3 tests/qemu_smoke.py --image-dir target/gen2/x86_64-unknown-uefi/release --gen2
      - name: Preserve the QEMU boot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-efi-qemu-logs
          path: |
            windows/efi-rust/target/qemu-smoke/**/serial.log
            windows/efi-rust/target/qemu-smoke/**/report.json
            windows/efi-rust/target/qemu-smoke/**/summary.json
            windows/efi-rust/target/qemu-smoke/**/R*.LOG
          if-no-files-found: ignore

  linux-unlock:
    name: Linux pre-driver module and offline firmware checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic zstd python3
      - name: Build the pre-driver module (never load it)
        run: |
          set -euo pipefail
          kdir=$(find /lib/modules -maxdepth 2 -name build | sort | tail -n1)
          test -n "$kdir"
          make -C linux/preboot/kernel KDIR="$kdir" W=1 -j2
      - name: Verify firmware preparation and parsers
        run: |
          set -euo pipefail
          python3 -m unittest discover -s linux/preboot/firmware -p 'test_*.py' -v
          python3 linux/preboot/firmware/prepare.py
          make -C linux/preboot offline-test
          bash -n linux/preboot/unlock.sh linux/preboot/gen2.sh linux/preboot/common.sh linux/preboot/mkinitcpio/cmp40-unlock

  go-tools:
    name: Go tools (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build + the unit tests (Windows-only test binary).
          - name: windows-native
            os: windows-latest
            cross: '0'
          # Cross-build from Linux, the quick completeness check.
          - name: linux-cross
            os: ubuntu-latest
            cross: '1'
    env:
      CROSS: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: windows/tools/inst40hx/go.mod
          cache-dependency-path: windows/tools/*/go.sum

      - name: Check Go formatting
        if: matrix.cross == '1'
        shell: bash
        working-directory: windows/tools
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '::error::gofmt found unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build every module
        shell: bash
        working-directory: windows/tools
        run: |
          set -euo pipefail
          for m in 40hxcore check40x inst40hx uninstall40x winres_gen; do
            echo "::group::build $m"
            if [ "$CROSS" = "1" ]; then
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -C "$m" ./...
            else
              go build -C "$m" ./...
            fi
            echo "::endgroup::"
          done

      - name: Vet every module
        shell: bash
        working-directory: windows/tools
        run: |
          set -euo pipefail
          for m in 40hxcore check40x inst40hx uninstall40x winres_gen; do
            echo "::group::vet $m"
            if [ "$CROSS" = "1" ]; then
              GOOS=windows GOARCH=amd64 go vet -C "$m" ./...
            else
              go vet -C "$m" ./...
            fi
            echo "::endgroup::"
          done

      - name: Run unit tests
        if: matrix.cross == '0'
        shell: bash
        working-directory: windows/tools
        run: |
          set -euo pipefail
          for m in 40hxcore check40x inst40hx uninstall40x winres_gen; do
            echo "::group::test $m"
            go test -C "$m" ./...
            echo "::endgroup::"
          done

      - name: Build the shipped executables
        shell: bash
        working-directory: windows/tools
        run: |
          set -euo pipefail
          flags=(-trimpath -ldflags='-H=windowsgui -s -w')
          build() { # <module> <output>
            echo "::group::package $1 -> $2"
            if [ "$CROSS" = "1" ]; then
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -C "$1" "${flags[@]}" -o "$2" .
            else
              go build -C "$1" "${flags[@]}" -o "$2" .
            fi
            ls -l "$1/$2"
            echo "::endgroup::"
          }
          build inst40hx     40HXInstaller.exe
          build uninstall40x 40HXUninstaller.exe
          build check40x     40HXCheck.exe

      - name: Test the USB EFI copy helper
        if: matrix.cross == '0'
        shell: powershell
        run: windows/tools/test_efi_copy.ps1

      - name: Test the release package verifier
        if: matrix.cross == '0'
        shell: powershell
        run: windows/tools/test_package_verification.ps1

      # winres_gen produces a PE resource object, so it cross-generates fine
      # on Linux. Kept on the Linux leg because the byte comparison uses
      # `cmp`, which every Linux runner has.
      - name: Compare Windows version resources for each Go tool
        if: matrix.cross == '1'
        shell: bash
        working-directory: windows/tools/winres_gen
        run: |
          set -euo pipefail
          for module in inst40hx check40x uninstall40x winres_gen; do
            generated="$RUNNER_TEMP/$module.syso"
            go run . -tool "$module" "$generated"
            if ! cmp -s "$generated" "../$module/rsrc_windows_amd64.syso"; then
              echo "::error::$module has a stale Windows resource object"
              exit 1
            fi
          done
